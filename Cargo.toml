[package]
name = "cast-tv-terminal"
version = "0.1.0"
edition = "2021"
description = "Display a terminal multiplexer session on TV via Chromecast using Default Media Receiver + HLS"

[dependencies]
alacritty_terminal = "0.24"
tiny-skia = "0.11"
tokio = { version = "1", features = ["full"] }
axum = "0.7"
tower-http = { version = "0.5", features = ["cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
bytes = "1"
base64 = "0.22"
log = "0.4"
# Upstream-defect pin (spec-02 N1/G3 permits exactly this): alacritty_terminal
# 0.24.2 -> rustix-openpty 0.1.1 pulls rustix 0.38.44 without the `std`
# feature, so its no_std fd polyfill can never unify with std::os::fd. Forcing
# `std` on the already-present rustix 0.38.44 resolves it.
rustix = { version = "0.38.44", features = ["std"] }

# gstreamer and rust_cast are optional / gated for now since they need system deps
gstreamer = { version = "0.22", optional = true }
gstreamer-video = { version = "0.22", optional = true }
gstreamer-app = { version = "0.22", optional = true }
rust_cast = { version = "0.17", optional = true }

[features]
default = []
gstreamer = ["dep:gstreamer", "dep:gstreamer-video", "dep:gstreamer-app"]
cast = ["dep:rust_cast"]

[[test]]
name = "cast_tv_tests"
path = "tests/cast_tv_tests.rs"
